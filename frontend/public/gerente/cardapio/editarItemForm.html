<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Editar Item</title>
    <link rel="stylesheet" href="../../styles/stylesheet.css">
</head>
<body>
    <div class="header">🍕 PIZZARIA TYPE & DOUGH 🍕</div>
    <br><br>
    <div class="caixa" id="form-container">
        <h1>Editando Item</h1>
        <form id="form-edicao">
            Nome do Item: <br>
            <input type="text" id="nome" required> <br><br>
            Descrição:  <br>
            <textarea id="descricao" required></textarea> <br><br>
            Preço: <br>
            <input type="number" step="0.01" id="preco" required> <br><br>
            <button type="submit" class="Enviar">Salvar Alterações</button>
        </form>
        <p id="mensagem"></p>
        <br>
        <a href="./editarCardapioLista.html"><button class="Enviar" style="background-color: #555;">Voltar para a Lista</button></a>
    </div>
    <script src="../../../dist/gerente/cardapio/editarItemForm.js"></script>
</body>
</html>
