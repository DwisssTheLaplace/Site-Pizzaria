<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Promover para Funcionário</title>
    <link rel="stylesheet" href="../styles/stylesheet.css">
</head>
<body>
    <div class="header">🍕 PROMOVER FUNCIONÁRIO 🍕</div>
    <br><br>
    <div class="caixa">
        <h1>Promover Cliente para Funcionário</h1>
        <p>Digite o e-mail de um usuário existente para alterar seu cargo para "Funcionário".</p>
        <br>
        <form id="form-promocao">
            <label for="email">E-mail do Usuário:</label><br>
            <input type="email" id="email" required style="width: 80%; padding: 8px;"><br><br>
            <button type="submit" class="Enviar">Promover Usuário</button>
        </form>
        <br>
        <p id="mensagem"></p>
        <br>
        <a href="./menuGerente.html"><button class="Enviar" style="background-color: #555;">Voltar ao Menu</button></a>
    </div>
    <script src="../../dist/gerente/promoverFuncionario.js"></script>
</body>
</html>
